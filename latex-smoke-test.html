<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX Smoke Test</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --text: #1f2430;
      --muted: #5b6475;
      --border: #d9deea;
      --ok: #1f8f4f;
      --warn: #b65d00;
      --err: #bb1a1a;
      --btn: #2457d6;
      --btn-hover: #1b45ab;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .label {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text);
      background: #fcfdff;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--btn);
      cursor: pointer;
    }

    button:hover { background: var(--btn-hover); }

    .status {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }

    pre {
      margin: 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fbfcff;
      min-height: 110px;
      max-height: 320px;
      overflow: auto;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result-box {
      display: grid;
      gap: 10px;
    }

    iframe {
      width: 100%;
      min-height: 460px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    a {
      color: #0e4bda;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>LaTeX Smoke Test</h1>

    <section class="panel">
      <p class="label">Input</p>
      <textarea id="latexInput">\documentclass{article}
\begin{document}
Hello Resume
\end{document}</textarea>
      <div style="margin-top: 10px;">
        <button id="compileBtn" type="button">Compile</button>
      </div>
    </section>

    <section class="panel">
      <p class="label">Engine Status</p>
      <p id="engineStatus" class="status warn">Initializing</p>
    </section>

    <section class="panel">
      <p class="label">Compile Status</p>
      <p id="compileStatus" class="status">Idle</p>
    </section>

    <section class="panel">
      <p class="label">Logs</p>
      <pre id="logs">No logs yet.</pre>
    </section>

    <section class="panel">
      <p class="label">Result</p>
      <div id="result" class="result-box">No compilation result yet.</div>
    </section>
  </main>

  <script src="engine/XeTeXEngine.js"></script>
  <script src="engine/DvipdfmxEngine.js"></script>
  <script src="latex-smoke-test.js"></script>
</body>
</html>
