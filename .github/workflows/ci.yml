name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension syntax and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check JavaScript syntax
        run: find extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Package extension
        run: python3 scripts/package_extension.py
      - name: Check package integrity
        run: python3 -m zipfile -t build/AutoApply-extension.zip

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: job-tracker/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r job-tracker/requirements.txt pytest==9.2.0
      - name: Run tests
        run: python -m pytest -q
